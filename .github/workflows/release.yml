name: "Build & Release"

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            os_name: 'macOS-AppleSilicon'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            os_name: 'macOS-Intel'
          - platform: 'windows-latest'
            args: ''
            target: ''
            os_name: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare macOS Mihomo sidecar binaries
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/bin
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            if [ ! -f src-tauri/bin/mihomo-aarch64-apple-darwin ]; then
              echo "Fetching mihomo-darwin-arm64 v1.19.32..."
              curl -L -s https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-darwin-arm64-v1.19.32.gz -o /tmp/mihomo-arm64.gz
              gzip -d /tmp/mihomo-arm64.gz
              mv /tmp/mihomo-arm64 src-tauri/bin/mihomo-aarch64-apple-darwin
            fi
            chmod +x src-tauri/bin/mihomo-aarch64-apple-darwin
          fi
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            if [ ! -f src-tauri/bin/mihomo-x86_64-apple-darwin ]; then
              echo "Fetching mihomo-darwin-amd64-compatible v1.19.32..."
              curl -L -s https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-darwin-amd64-compatible-v1.19.32.gz -o /tmp/mihomo-amd64.gz
              gzip -d /tmp/mihomo-amd64.gz
              mv /tmp/mihomo-amd64 src-tauri/bin/mihomo-x86_64-apple-darwin
            fi
            chmod +x src-tauri/bin/mihomo-x86_64-apple-darwin
          fi

      - name: Prepare Windows Mihomo sidecar binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ ! -f src-tauri/bin/mihomo-x86_64-pc-windows-msvc.exe ]; then
            echo "Fetching mihomo-windows-amd64-compatible v1.19.32..."
            curl -L -s https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-windows-amd64-compatible-v1.19.32.zip -o /tmp/mihomo-win.zip
            unzip -q /tmp/mihomo-win.zip -d /tmp/mihomo-win
            mv /tmp/mihomo-win/mihomo-windows-amd64*.exe src-tauri/bin/mihomo-x86_64-pc-windows-msvc.exe
          fi

      - name: Install npm dependencies
        run: npm install

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'ProxyDistribution ${{ github.ref_name }}'
          releaseBody: 'ProxyDistribution Multi-port Proxy Pool'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProxyDistribution-${{ matrix.os_name }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: warn
